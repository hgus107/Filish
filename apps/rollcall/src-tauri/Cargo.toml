[package]
name = "rollcall"
version = "0.1.2"
description = "Preview-first batch file renamer"
authors = ["Harish Gupta"]
edition = "2021"

[lib]
name = "rollcall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
unicode-normalization = "0.1"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSEvent", "NSOpenPanel", "NSResponder", "NSWindow"] }
