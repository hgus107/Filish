[package]
name = "yofile"
version = "0.1.0"
description = "YoFile — local file tools: convert, rename, and PDF"
authors = ["Harish Gupta"]
edition = "2021"

[lib]
name = "yofile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
